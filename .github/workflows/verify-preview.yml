name: Verify distributed preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify current public documentation contracts
        run: node --test tests/public-docs.test.mjs
      - name: Download exact public evaluation artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/bridge-download"
          gh release download v0.2.0-preview.0 --repo cynarax/bridge-by-ganado --pattern 'ganado-bridge-0.2.0-preview.0.mcpb' --dir "$RUNNER_TEMP/bridge-download"
      - name: Verify hash, consent, first task, search, process and removal
        run: node scripts/verify-preview.mjs "$RUNNER_TEMP/bridge-download/ganado-bridge-0.2.0-preview.0.mcpb" server.json
